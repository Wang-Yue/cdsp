[package]
name = "rust-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
CamillaDSP = { git = "https://github.com/HEnquist/camilladsp", branch = "next5", default-features = false }
serde_json = "1.0"
log = "0.4"
parking_lot = "0.12"

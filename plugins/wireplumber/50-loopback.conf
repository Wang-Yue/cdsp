# =============================================================
# WirePlumber ALSA Loopback Configuration
# =============================================================

# Disable the raw loopback playback sink so that GNOME/KDE sound settings
# presents "CDSP Studio Dynamic Rate Audio" (cdsp_sink) rather than the raw
# unnotified loopback device.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*snd_aloop.*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]


# =============================================================
# WirePlumber ALSA Loopback Interleaved Format
# =============================================================

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*snd_aloop.*"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S32LE"
      }
    }
  }
]

# =============================================================
# PipeWire Audio Sinks for CDSP Studio / CamillaDSP
# Exposes dedicated Stereo (2ch), Surround (8ch), and Pro Audio (32ch)
# sinks with dynamic sample rate switching (44.1 kHz - 768 kHz).
# =============================================================

context.spa-libs = {
    api.alsa.* = alsa/libspa-alsa
}

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
}

context.objects = [
    # 1. Stereo Sink (2 channels: Front-Left, Front-Right)
    { factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "cdsp_sink_2ch"
            node.description       = "CDSP Studio (Stereo 2ch)"
            media.class            = "Audio/Sink"
            api.alsa.path          = "cdsp"
            api.alsa.disable-mmap  = true
            audio.format           = "S32LE"
            audio.channels         = 2
            audio.position         = [ FL FR ]
            audio.allowed-rates    = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
            priority.driver        = 2000
            priority.session       = 2000
        }
    }

    # 2. Surround Sink (8 channels: 7.1 / 5.1 Surround)
    { factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "cdsp_sink_8ch"
            node.description       = "CDSP Studio (Surround 8ch)"
            media.class            = "Audio/Sink"
            api.alsa.path          = "cdsp"
            api.alsa.disable-mmap  = true
            audio.format           = "S32LE"
            audio.channels         = 8
            audio.position         = [ FL FR FC LFE RL RR SL SR ]
            audio.allowed-rates    = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
            priority.driver        = 1900
            priority.session       = 1900
        }
    }

    # 3. Pro Audio Sink (32 channels: Raw multi-channel / active crossovers)
    { factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "cdsp_sink_32ch"
            node.description       = "CDSP Studio (Pro Audio 32ch)"
            media.class            = "Audio/Sink"
            api.alsa.path          = "cdsp"
            api.alsa.disable-mmap  = true
            audio.format           = "S32LE"
            audio.channels         = 32
            audio.allowed-rates    = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
            priority.driver        = 1800
            priority.session       = 1800
        }
    }
]

# =============================================================
# PipeWire Audio Sink for CDSP Studio / CamillaDSP
# Exposes the cdsp ALSA rate notify plugin as a native stereo sink
# visible in GNOME / KDE Sound Settings with dynamic rate switching.
# =============================================================

context.spa-libs = {
    api.alsa.* = alsa/libspa-alsa
}

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
}

context.objects = [
    { factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "cdsp_sink"
            node.description       = "CDSP Studio Dynamic Rate Audio"
            media.class            = "Audio/Sink"
            api.alsa.path          = "cdsp"
            api.alsa.disable-mmap  = true
            audio.format           = "S32LE"
            audio.channels         = 2
            audio.position         = [ FL FR ]
            audio.allowed-rates    = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
            priority.driver        = 2000
            priority.session       = 2000
        }
    }
]

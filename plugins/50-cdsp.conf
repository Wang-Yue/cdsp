# ALSA configuration for Monitor-Qt / CamillaDSP Dynamic Rate Notify Plugin

pcm.cdsp {
    @args [ SLAVE CTL_CARD CTL_DEV CTL_SUBDEV ]
    @args.SLAVE {
        type string
        default "hw:Loopback,0,0"
    }
    @args.CTL_CARD {
        type string
        default "Loopback"
    }
    @args.CTL_DEV {
        type integer
        default 1
    }
    @args.CTL_SUBDEV {
        type integer
        default 0
    }
    type rate_notify
    slave $SLAVE
    ctl_card $CTL_CARD
    ctl_device $CTL_DEV
    ctl_subdevice $CTL_SUBDEV
    hint {
        show {
            @func refer
            name defaults.namehint.basic
        }
        description "Monitor-Qt / CamillaDSP Dynamic Rate Audio"
    }
}

ctl.cdsp {
    @args [ CARD ]
    @args.CARD {
        type string
        default "Loopback"
    }
    type hw
    card $CARD
}

name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC (Weekly build)
  workflow_dispatch:      # Allows triggering a build manually from Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # macOS (Apple Silicon)
  # ============================================================================
  macos-test:
    name: macOS Test
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-test-brew-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: macos-test-brew-

      - name: Install dependencies via Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install fftw libyaml cjson libwebsockets blackhole-2ch blackhole-16ch
          sudo killall coreaudiod || true
          sleep 2

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_NATIVE_ARCH=OFF \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_STUDIO=OFF

      - name: Build Test Runner
        run: cmake --build build --target test_runner -j$(sysctl -n hw.ncpu)

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -j$(sysctl -n hw.ncpu)

  macos-studio:
    name: macOS Studio Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-studio-brew-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: macos-studio-brew-

      - name: Install dependencies via Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install fftw libyaml cjson libwebsockets qt

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_NATIVE_ARCH=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_STUDIO=ON

      - name: Build CDSP Studio
        run: cmake --build build --target cdsp-studio -j$(sysctl -n hw.ncpu)

      - name: Package CDSP Studio (.app)
        run: |
          export PATH="$(brew --prefix qt 2>/dev/null || echo /opt/homebrew/opt/qt)/bin:$PATH"
          rm -f "$(brew --prefix qt 2>/dev/null)/share/qt/plugins/platforminputcontexts/libqtvirtualkeyboardplugin.dylib" 2>/dev/null || true
          rm -f "/opt/homebrew/share/qt/plugins/platforminputcontexts/libqtvirtualkeyboardplugin.dylib" 2>/dev/null || true
          macdeployqt "build/bin/CDSP Studio.app" -always-overwrite
          rm -rf "build/bin/CDSP Studio.app/Contents/PlugIns/platforminputcontexts" 2>/dev/null || true
          codesign --force --deep --sign - "build/bin/CDSP Studio.app"
          ditto -c -k --keepParent "build/bin/CDSP Studio.app" build/bin/CDSPStudio-macOS-arm64.zip

      - name: Upload macOS Studio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDSPStudio-macOS-arm64
          path: build/bin/CDSPStudio-macOS-arm64.zip
          if-no-files-found: error

  # ============================================================================
  # Linux (Ubuntu x86_64)
  # ============================================================================
  linux-test:
    name: Linux Test (with KVM & snd-aloop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: linux-test-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: linux-test-apt-

      - name: Configure APT cache
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/01keep-debs

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            llvm \
            libasound2-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libfftw3-dev \
            libyaml-dev \
            libcjson-dev \
            libwebsockets-dev \
            libssl-dev \
            libopenblas-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_NATIVE_ARCH=OFF \
            -DENABLE_ALSA=ON \
            -DENABLE_PIPEWIRE=ON \
            -DENABLE_DBUS=ON \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_STUDIO=OFF

      - name: Build Test Runner
        run: cmake --build build --target test_runner

      - name: Make KVM usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and cloud utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      - name: Cache Ubuntu cloud image
        id: cache-cloud-image
        uses: actions/cache@v4
        with:
          path: base.img
          key: ubuntu-cloudimg-noble-24.04

      - name: Download Ubuntu cloud image if not cached
        if: steps.cache-cloud-image.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o base.img "https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img"

      - name: Boot the VM for ALSA snd-aloop
        run: |
          qemu-img create -f qcow2 -F qcow2 -b base.img vm.qcow2 10G
          ssh-keygen -q -t ed25519 -N '' -f vm_key
          cat > user-data <<EOF
          #cloud-config
          ssh_authorized_keys:
            - $(cat vm_key.pub)
          EOF
          echo "instance-id: e2e" > meta-data
          cloud-localds seed.img user-data meta-data
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName localhost
            Port 2222
            User ubuntu
            IdentityFile $PWD/vm_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            ConnectTimeout 5
          EOF
          qemu-system-x86_64 -enable-kvm -cpu host -smp 2 -m 2048 \
            -drive file=vm.qcow2,if=virtio \
            -drive file=seed.img,if=virtio,format=raw \
            -nic user,model=virtio,hostfwd=tcp:127.0.0.1:2222-:22 \
            -display none -serial file:console.log -daemonize
          start=$(date +%s)
          until ssh vm true 2>/dev/null; do
            if [ $(( $(date +%s) - start )) -gt 300 ]; then
              echo "no ssh after 300 s"
              exit 1
            fi
            sleep 2
          done
          echo "ssh up after $(( $(date +%s) - start )) s"
          ssh vm cloud-init status --wait || echo "cloud-init status $?"

      - name: Load snd-aloop and install test dependencies
        run: |
          ssh vm bash -s <<'EOF'
          set -e
          sudo apt-get update -q
          if ! modinfo snd-aloop snd-dummy >/dev/null 2>&1; then
            sudo apt-get install -y -q --no-install-recommends "linux-modules-extra-$(uname -r)"
          fi
          sudo apt-get install -y -q --no-install-recommends \
            alsa-utils \
            cmake \
            libasound2-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libfftw3-dev \
            libyaml-dev \
            libcjson-dev \
            libwebsockets-dev \
            libssl-dev \
            libopenblas-dev
          sudo modprobe snd-aloop pcm_substreams=2
          sudo modprobe snd-dummy || true
          sudo usermod -aG audio ubuntu
          printf '@audio - rtprio 95\n@audio - memlock unlimited\n' \
            | sudo tee /etc/security/limits.d/95-audio.conf
          cat /proc/asound/cards
          EOF

      - name: Run Tests (with snd-aloop)
        run: |
          ssh vm "sudo mkdir -p '$GITHUB_WORKSPACE' && sudo chown -R ubuntu:ubuntu /home/runner"
          tar --exclude="AppDir" --exclude="*.AppImage" -cf - . | ssh vm "tar -xf - -C '$GITHUB_WORKSPACE'"
          ssh vm "cd '$GITHUB_WORKSPACE' && ctest --test-dir build --output-on-failure -j\$(nproc)"

      - name: Guest console on failure
        if: failure()
        run: cat console.log || true

  linux-studio:
    name: Linux Studio Build (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: linux-studio-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: linux-studio-apt-

      - name: Configure APT cache
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/01keep-debs

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            llvm \
            libasound2-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libfftw3-dev \
            libyaml-dev \
            libcjson-dev \
            libwebsockets-dev \
            libssl-dev \
            libopenblas-dev \
            qt6-base-dev \
            qt6-multimedia-dev \
            libfuse2 \
            file

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_NATIVE_ARCH=OFF \
            -DENABLE_ALSA=ON \
            -DENABLE_PIPEWIRE=ON \
            -DENABLE_DBUS=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_STUDIO=ON

      - name: Build CDSP Studio
        run: cmake --build build --target cdsp-studio

      - name: Package CDSP Studio (AppImage)
        run: |
          cmake --install build/studio --prefix AppDir/usr
          curl -sLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(command -v qmake6 || echo /usr/lib/qt6/bin/qmake)"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -d studio/cmake/com.wangyue.cdspstudio.desktop \
            -i studio/resources/icons/app.png \
            --plugin qt \
            --output appimage
          mkdir -p build/dist
          mv CDSP_Studio*.AppImage build/dist/CDSPStudio-Linux-x86_64.AppImage

      - name: Upload Linux Studio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDSPStudio-Linux-x86_64
          path: build/dist/CDSPStudio-Linux-x86_64.AppImage
          if-no-files-found: error

  # ============================================================================
  # Sanitizers
  # ============================================================================
  linux-sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, leak, thread, intsan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: linux-sanitizer-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: linux-sanitizer-apt-

      - name: Configure APT cache
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/01keep-debs

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            llvm \
            libasound2-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libfftw3-dev \
            libyaml-dev \
            libcjson-dev \
            libwebsockets-dev \
            libssl-dev \
            libopenblas-dev

      - name: Run Sanitizer
        run: ./run_sanitizers.sh ${{ matrix.sanitizer }}

  # ============================================================================
  # Windows (UCRT64 x86_64)
  # ============================================================================
  windows-test:
    name: Windows Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 & UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-libyaml
            mingw-w64-ucrt-x86_64-cjson
            mingw-w64-ucrt-x86_64-libwebsockets

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_NATIVE_ARCH=OFF \
            -DENABLE_WASAPI=ON \
            -DENABLE_ASIO=ON \
            -DENABLE_STATIC_WINDOWS=ON \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_STUDIO=OFF

      - name: Build Test Runner
        shell: msys2 {0}
        run: cmake --build build --target test_runner

      - name: Start the audio service and allow microphone access
        shell: pwsh
        run: |
          Set-Service audiosrv -StartupType Automatic
          Start-Service audiosrv
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name LetAppsAccessMicrophone -Value 1 -PropertyType DWord -Force | Out-Null

      - name: Cache VB-Cable and FlexASIO Installers
        id: cache-audio-drivers
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vbcable.zip
            ${{ runner.temp }}/FlexASIO.exe
          key: win-audio-drivers-vbcable45-flexasio110b

      - name: Download VB-Cable if not cached
        if: steps.cache-audio-drivers.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vbcable.zip"
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip -OutFile $zip

      - name: Install VB-Cable
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vbcable.zip"
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vbcable" -Force
          tools/install_vbcable.ps1 -Dir "$env:RUNNER_TEMP\vbcable"
          Get-PnpDevice -FriendlyName '*CABLE*' | Format-Table Class, Status, FriendlyName -AutoSize

      - name: Download FlexASIO if not cached
        if: steps.cache-audio-drivers.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\FlexASIO.exe"
          Invoke-WebRequest https://github.com/dechamps/FlexASIO/releases/download/flexasio-1.10b/FlexASIO-1.10b.exe -OutFile $exe

      - name: Install FlexASIO
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\FlexASIO.exe"
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Get-ChildItem 'HKLM:\SOFTWARE\ASIO' | Format-Table PSChildName

      - name: Run Tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

  windows-studio:
    name: Windows Studio Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 & UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-libyaml
            mingw-w64-ucrt-x86_64-cjson
            mingw-w64-ucrt-x86_64-libwebsockets
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_NATIVE_ARCH=OFF \
            -DENABLE_WASAPI=ON \
            -DENABLE_ASIO=ON \
            -DENABLE_STATIC_WINDOWS=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_STUDIO=ON

      - name: Build CDSP Studio
        shell: msys2 {0}
        run: cmake --build build --target cdsp-studio

      - name: Package CDSP Studio (Windows)
        shell: msys2 {0}
        run: cp build/bin/CDSPStudio.exe build/bin/CDSPStudio-Windows-x86_64.exe

      - name: Upload Windows Studio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDSPStudio-Windows-x86_64
          path: build/bin/CDSPStudio-Windows-x86_64.exe
          if-no-files-found: error

  # ============================================================================
  # Release Publishing
  # ============================================================================
  release:
    name: Publish Release
    needs: [macos-test, macos-studio, linux-test, linux-studio, windows-test, windows-studio, linux-sanitizers]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA256 checksums
        run: |
          cd release-assets
          sha256sum CDSPStudio* > SHA256SUMS.txt
          ls -la

      - name: Update weekly tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f weekly ${{ github.sha }}
          git push -f origin weekly

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'weekly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Weekly Build' }}
          body: |
            Automated build from commit ${{ github.sha }}.

            ### Downloads
            - **macOS (Apple Silicon)**: [`CDSPStudio-macOS-arm64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'weekly' }}/CDSPStudio-macOS-arm64.zip)
            - **Linux (x86_64)**: [`CDSPStudio-Linux-x86_64.AppImage`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'weekly' }}/CDSPStudio-Linux-x86_64.AppImage)
            - **Windows (x86_64)**: [`CDSPStudio-Windows-x86_64.exe`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'weekly' }}/CDSPStudio-Windows-x86_64.exe)

            Verify integrity with `SHA256SUMS.txt`.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
